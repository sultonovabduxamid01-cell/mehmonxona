<!DOCTYPE html>

<html lang="uz">

<head>
    <meta charset="UTF-8">

```
<title>O‘chirish</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
    }

    .box {
        max-width: 500px;
        margin: 120px auto;
        background: white;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0, 0, 0, .08);
    }

    h1 {
        color: #111827;
    }

    p {
        color: #6b7280;
    }

    .buttons {
        display: flex;
        gap: 12px;
        margin-top: 30px;
    }

    button,
    a {
        flex: 1;
        padding: 13px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
    }

    button {
        border: none;
        background: #ef4444;
        color: white;
        cursor: pointer;
    }

    a {
        background: #e5e7eb;
        color: #111827;
    }
</style>
```

</head>

<body>

<div class="box">

```
<h1>🗑 O‘chirish</h1>

<p>
    <strong>{{ mehmonxona.nomi }}</strong>
    mehmonxonasini o‘chirmoqchimisiz?
</p>

<form method="POST">

    {% csrf_token %}

    <!-- ID ni POST orqali yuboradi -->
    <input
        type="hidden"
        name="id"
        value="{{ mehmonxona.id }}"
    >

    <div class="buttons">

        <a href="{% url 'mehmonxonalar' %}">
            Bekor qilish
        </a>

        <button type="submit">
            Ha, o‘chirish
        </button>

    </div>

</form>
```

</div>

</body>

</html>
