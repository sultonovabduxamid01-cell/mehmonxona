<!DOCTYPE html>

<head>

```
<title>Mehmonxona qo‘shish</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
    }

    .container {
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
    }

    .card {
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, .08);
    }

    h1 {
        margin-bottom: 30px;
    }

    .field {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    input,
    textarea {
        width: 100%;
        padding: 13px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 15px;
        box-sizing: border-box;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    input:focus,
    textarea:focus {
        outline: none;
        border-color: #6366f1;
    }

    .btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: #6366f1;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .btn:hover {
        background: #4f46e5;
    }

    .back {
        display: block;
        margin-bottom: 20px;
        text-decoration: none;
        color: #6366f1;
    }
</style>
```

</head>

<body>

<div class="container">

```
<a href="{% url 'mehmonxonalar' %}" class="back">
    ← Orqaga
</a>

<div class="card">

    <h1>🏨 Mehmonxona qo‘shish</h1>

    <form method="POST">

        {% csrf_token %}

        <div class="field">
            <label>Mehmonxona nomi</label>
            <input
                type="text"
                name="nomi"
                placeholder="Masalan: Hilton Tashkent"
                required
            >
        </div>

        <div class="field">
            <label>Ma'lumot</label>
            <textarea
                name="malumot"
                placeholder="Mehmonxona haqida ma'lumot..."
                required
            ></textarea>
        </div>

        <div class="field">
            <label>Yulduz soni</label>
            <input
                type="number"
                name="yulduz_soni"
                placeholder="Masalan: 5"
                min="1"
                max="5"
                required
            >
        </div>

        <div class="field">
            <label>Xona soni</label>
            <input
                type="number"
                name="xona_soni"
                placeholder="Masalan: 120"
                required
            >
        </div>

        <div class="field">
            <label>Bir kunlik narx</label>
            <input
                type="number"
                name="bir_kunlik_narx"
                placeholder="Masalan: 500000"
                required
            >
        </div>

        <div class="field">
            <label>Wi-Fi</label>
            <input
                type="text"
                name="wifi_bormi"
                placeholder="bor / yo‘q"
                required
            >
        </div>

        <div class="field">
            <label>Email</label>
            <input
                type="number"
                name="emaili"
                placeholder="Email"
                required
            >
        </div>

        <div class="field">
            <label>Ochilgan sana</label>
            <input
                type="datetime-local"
                name="ochilgan_sana"
                required
            >
        </div>

         <div class="field">
            <label>manzil</label>
            <input
                type="manzil"
                name="manzil"
                required
            >
        </div>

        <button type="submit" class="btn">
            Saqlash
        </button>

    </form>

</div>
```

</div>

</body>
</html>
